name: Upload

on:
  push:
    branches:
      - main
      - maintenance/0.30.1
      - prepare/alerts01058-formal031
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
        calcit test --require-match --summary-only --format json
        node acceptance/prepare-alerts.mjs
        calcit calcit.cirru edit format
        test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit calcit.cirru test --tag unit --require-match
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Select frontend CDN path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build frontend with CDN URLs
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"

    - name: Render prompt and typed Reel regression tests
      run: node --test scripts/prompt-render.test.mjs scripts/typed-reel-render.test.mjs

    - name: Check out real Shelf consumer
      uses: actions/checkout@v7.0.1
      with:
        repository: worktools/qrcode-shelf
        ref: 31bcc8b88d66fc24789650732ed4cb8ff7c234f6
        path: .calcit/consumer
        persist-credentials: false

    - name: Check out unpublished Feather candidate
      uses: actions/checkout@v7.0.1
      with:
        repository: Respo/respo-feather.calcit
        ref: ecf65b0952076e6d1cecf5e42fffae4a5347999f
        path: .calcit/consumer/.calcit/modules/respo-feather.calcit
        persist-credentials: false

    - name: Validate real consumer with local candidates
      run: |
        set -euo pipefail
        consumer="$GITHUB_WORKSPACE/.calcit/consumer"
        cp -RL .calcit/modules/. "$consumer/.calcit/modules/"
        mkdir -p "$consumer/.calcit/modules/alerts.calcit"
        cp calcit.cirru deps.cirru "$consumer/.calcit/modules/alerts.calcit/"
        # Explicit local candidate graph, NOT a Caps-resolved release install.
        # The consumer Snapshot remains unchanged.
        cat > "$consumer/deps.cirru" <<'EOF'
        {} (:calcit-version |0.30.1) (:version |0.1.0)
          :dependencies $ {} (|Respo/reel.calcit |0.6.42)
            |Respo/respo-ui.calcit |0.8.1
            |Respo/respo.calcit |0.16.126
            |Respo/respo-feather.calcit |0.4.30
            |Respo/alerts.calcit |0.10.58
            |calcit-lang/js-ffi |0.2.6
        EOF
        cd "$consumer"
        yarn add --exact @calcit/procs@0.30.1
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json > "$RUNNER_TEMP/shelf-strict.json"
        jq -e '.data.workflow.status == "passed" and (.diagnostics | length == 0)' "$RUNNER_TEMP/shelf-strict.json"
        VITE_BASE_URL=./ yarn build
        node --test scripts/qrcode-regression.test.mjs

    - name: Preserve PR consumer for interaction acceptance
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: qrcode-shelf-local-candidates
        path: |
          .calcit/consumer/dist
          .calcit/consumer/deps.cirru
          .calcit/consumer/package.json
          .calcit/consumer/yarn.lock
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

    - name: Check COS credentials
      id: cos-credentials
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
          else
            echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
            exit 1
          fi
        fi

    - name: Check current production revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: production
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
        fi

    - name: Upload and verify frontend assets on COS
      if: steps.cos-credentials.outputs.available == 'true' && (steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository))
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      if: steps.production.outputs.current == 'true'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: steps.production.outputs.current == 'true'
      run: echo "${{ steps.deploy.outputs.status }}"

    - name: Preserve prepared source and original producer/consumer bundles
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: alerts-prepared
        path: |
          calcit.cirru
          acceptance/
          js-out/
          dist/
          .calcit/consumer/dist/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
