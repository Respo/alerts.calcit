name: Prepare Modal contract
on:
  push:
    branches: [prepare/modal-actions-contract031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve exact formal graph
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Original static and native gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests-before.json
          calcit js
          yarn vite build --base=./
      - name: Official guarded source transaction
        run: node apply-reviewed.mjs
      - name: Complete original gates after edits
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests.json
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit js
          node --test scripts/prompt-render.test.mjs scripts/typed-reel-render.test.mjs | tee acceptance/render.log
          yarn vite build --base=./
          git diff --quiet -- scripts
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - name: Check out original reporting Docs consumer
        uses: actions/checkout@v7.0.1
        with:
          repository: calcit-lang/docs-workflow
          ref: cf7480696d490735fa586c3fcc3e631792e17b2f
          path: .calcit/docs-consumer
          persist-credentials: false
      - name: Verify real consumer without Unit return workaround
        working-directory: .calcit/docs-consumer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf7480696d490735fa586c3fcc3e631792e17b2f
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
          # Explicit local Alerts candidate overlay, not a published Caps install.
          cp "$GITHUB_WORKSPACE/calcit.cirru" "$GITHUB_WORKSPACE/deps.cirru" .calcit/modules/alerts.calcit/
          node "$GITHUB_WORKSPACE/accept-docs-consumer.mjs"
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee "$GITHUB_WORKSPACE/acceptance/docs-consumer/strict.json" | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee "$GITHUB_WORKSPACE/acceptance/docs-consumer/tests.json"
          calcit js
          node --test test/navigation.test.mjs | tee "$GITHUB_WORKSPACE/acceptance/docs-consumer/navigation.log"
          yarn vite build --base=./
          cp -R dist "$GITHUB_WORKSPACE/acceptance/docs-consumer/dist"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: alerts-modal-source-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
